name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://openplovdiv.test
      - run: npm run validate:seo
        env:
          PUBLIC_SITE_URL: https://openplovdiv.test
      - run: npm run validate:llms
